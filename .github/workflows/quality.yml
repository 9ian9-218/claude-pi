name: Runtime quality
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: runtime-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap
      - name: Require a working Linux isolation backend
        run: |
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-net -- /bin/true
      - run: npm ci
      - run: npm run check
      - run: npm run eval:reliability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-evals-node-${{ matrix.node }}
          path: .agent/evals
  production-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:pack
